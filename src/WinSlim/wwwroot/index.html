<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WinSlim 轻装</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <aside class="side" aria-label="导航">
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="var(--accent)"/>
          <rect x="6" y="6" width="12" height="2.4" rx="1.2" fill="#fff"/>
          <rect x="6" y="10.8" width="8.4" height="2.4" rx="1.2" fill="#fff"/>
          <rect x="6" y="15.6" width="4.8" height="2.4" rx="1.2" fill="#fff"/>
        </svg>
        <b>WinSlim 轻装</b>
      </div>
      <div class="scope" id="scope"><strong><span class="skeleton"></span></strong><span class="skeleton"></span></div>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M2.5 9.5a5.5 5.5 0 0 1 11 0"/><path d="M8 9.5 10.5 6"/><path d="M2.5 12.5h11"/></svg>
          概览
        </a>
        <a href="#/tweaks" data-route="tweaks">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"/><circle cx="11" cy="4.5" r="1.5"/><circle cx="5" cy="11.5" r="1.5"/></svg>
          优化项
          <span class="count num" id="nav-staged" hidden></span>
        </a>
        <a href="#/apps" data-route="apps">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
          预装应用
        </a>
        <a href="#/cleanup" data-route="cleanup">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.2a1 1 0 0 0 1 .8h3.8a1 1 0 0 0 1-.8l.6-8.2"/></svg>
          磁盘清理
        </a>
        <a href="#/history" data-route="history">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-width="1.5"><path d="M2.8 8a5.2 5.2 0 1 0 1.5-3.7"/><path d="M2.5 2.5v2.5H5"/><path d="M8 5.3V8l2 1.3"/></svg>
          改动记录
        </a>
      </nav>
      <div class="side-foot" id="side-foot">每项改动都会先备份原值，随时可以还原。</div>
    </aside>

    <header class="top">
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
        <input id="search" type="search" placeholder="搜索优化项，例如“右键菜单”“广告”" autocomplete="off" aria-label="搜索优化项">
        <kbd>Ctrl K</kbd>
      </label>
      <span class="host" id="host"></span>
    </header>

    <main class="sheet">
      <div class="view" id="view" tabindex="-1"></div>
      <div class="tray" id="tray" hidden></div>
    </main>
  </div>

  <dialog id="dialog"></dialog>

  <script>
    // 浏览器里预览界面时（没有 WebView2 宿主），载入模拟后台。
    if (!(window.chrome && window.chrome.webview)) document.write('<script src="/dev/mock.js"><\/script>');
  </script>
  <script src="app.js"></script>
</body>
</html>
